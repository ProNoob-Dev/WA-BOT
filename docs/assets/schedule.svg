<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="A day with the bot">
<rect x="0" y="0" width="900" height="200" rx="16" fill="#0e1513" stroke="#1f2a26"/>
<text x="28" y="34" font-size="12" letter-spacing="2.5" font-weight="700" fill="#25D366">A DAY WITH THE BOT</text>
<line x1="60" y1="108" x2="840" y2="108" stroke="#1f2a26" stroke-width="3" stroke-linecap="round"/>
<line x1="60" y1="102" x2="60" y2="114" stroke="#8696a0" stroke-width="1.5"/>
<text x="60" y="138" font-size="11" fill="#8696a0" text-anchor="middle">00:00</text>
<line x1="158" y1="102" x2="158" y2="114" stroke="#8696a0" stroke-width="1.5"/>
