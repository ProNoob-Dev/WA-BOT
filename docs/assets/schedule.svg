<line x1="352" y1="102" x2="352" y2="114" stroke="#8696a0" stroke-width="1.5"/>
<text x="352" y="138" font-size="11" fill="#8696a0" text-anchor="middle">09:00</text>
<line x1="450" y1="102" x2="450" y2="114" stroke="#8696a0" stroke-width="1.5"/>
<text x="450" y="138" font-size="11" fill="#8696a0" text-anchor="middle">12:00</text>
<line x1="548" y1="102" x2="548" y2="114" stroke="#8696a0" stroke-width="1.5"/>
<text x="548" y="138" font-size="11" fill="#8696a0" text-anchor="middle">15:00</text>
<line x1="645" y1="102" x2="645" y2="114" stroke="#8696a0" stroke-width="1.5"/>
<text x="645" y="138" font-size="11" fill="#8696a0" text-anchor="middle">18:00</text>
<line x1="742" y1="102" x2="742" y2="114" stroke="#8696a0" stroke-width="1.5"/>
<text x="742" y="138" font-size="11" fill="#8696a0" text-anchor="middle">21:00</text>
<line x1="840" y1="102" x2="840" y2="114" stroke="#8696a0" stroke-width="1.5"/>
<text x="840" y="138" font-size="11" fill="#8696a0" text-anchor="middle">24:00</text>
<circle cx="352" cy="108" r="8" fill="#25D366"/>
<circle cx="352" cy="108" r="13" fill="none" stroke="#25D366" stroke-width="1.5" opacity="0.5"/>
<text x="352" y="74" font-size="13" font-weight="700" fill="#e9edef" text-anchor="middle">09:00 · chat opens</text>
<text x="352" y="90" font-size="11.5" fill="#8696a0" text-anchor="middle">groups unlock + greeting</text>
<circle cx="759" cy="108" r="8" fill="#25D366"/>
<circle cx="759" cy="108" r="13" fill="none" stroke="#25D366" stroke-width="1.5" opacity="0.5"/>
<text x="759" y="74" font-size="13" font-weight="700" fill="#e9edef" text-anchor="middle">evening · recap</text>
<text x="759" y="90" font-size="11.5" fill="#8696a0" text-anchor="middle">AI summary of the day</text>
<circle cx="837" cy="108" r="8" fill="#f0b429"/>
<circle cx="837" cy="108" r="13" fill="none" stroke="#f0b429" stroke-width="1.5" opacity="0.5"/>
<text x="872" y="74" font-size="13" font-weight="700" fill="#e9edef" text-anchor="end">23:55 · chat closes</text>
<text x="872" y="90" font-size="11.5" fill="#8696a0" text-anchor="end">groups lock for the night</text>
<rect x="369" y="154" width="374" height="18" rx="9" fill="#122019"/>
<text x="556" y="167" font-size="11" fill="#25D366" text-anchor="middle">all day · courses poll · news digests · GitHub trending</text>
<circle r="6" fill="#25D366"><animateMotion dur="24s" repeatCount="indefinite" path="M 60 108 L 840 108"/></circle>
</svg>
