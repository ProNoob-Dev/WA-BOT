<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="WhatsApp chat: a hubcloud link is pasted and WA-BOT replies with bypassed short links">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24343d"/><stop offset="1" stop-color="#1f2c34"/>
    </linearGradient>
  </defs>
  <!-- depth: offset shadow layer -->
  <rect x="10" y="12" width="780" height="440" rx="18" fill="#04110a"/>
  <rect x="0" y="0" width="780" height="440" rx="18" fill="#0b141a"/>
  <!-- header -->
  <rect x="0" y="0" width="780" height="56" rx="18" fill="url(#hdr)"/>
  <rect x="0" y="38" width="780" height="18" fill="#1f2c34"/>
  <circle cx="36" cy="28" r="18" fill="#25D366"/>
  <text x="36" y="34" font-size="17" font-weight="700" fill="#06281a" text-anchor="middle">W</text>
  <text x="64" y="25" font-size="16" font-weight="700" fill="#e9edef">WA-BOT</text>
  <text x="64" y="43" font-size="12" fill="#25D366">online · replies in seconds</text>
  <rect x="636" y="14" width="124" height="28" rx="14" fill="none" stroke="#25D366" stroke-opacity="0.6"/>
  <text x="698" y="33" font-size="12" font-weight="600" fill="#25D366" text-anchor="middle">HDHUB BYPASS</text>

  <!-- user bubble 1 : hubcloud link -->
  <g opacity="1">
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.93;1" dur="14s" repeatCount="indefinite"/>
    <rect x="360" y="72" width="400" height="44" rx="10" fill="#005c4b"/>
    <text x="376" y="99" font-size="15" fill="#e9edef">hubcloud.pw/drive/cwwasezsnrfy2uw</text>
    <text x="744" y="106" font-size="11" fill="#9fc5b8" text-anchor="end">15:32</text>
  </g>

  <!-- typing indicator -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.10;0.14;0.24;0.28;1" dur="14s" repeatCount="indefinite"/>
    <rect x="20" y="128" width="86" height="36" rx="10" fill="#202c33"/>
    <circle cx="42" cy="146" r="4.5" fill="#8696a0">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="0.9s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="62" cy="146" r="4.5" fill="#8696a0">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="0.9s" begin="1.55s" repeatCount="indefinite"/>
    </circle>
    <circle cx="82" cy="146" r="4.5" fill="#8696a0">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="0.9s" begin="1.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- bot reply 1 : bypassed links -->
  <g opacity="1">
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.93;1" dur="14s" repeatCount="indefinite"/>
    <rect x="20" y="176" width="560" height="118" rx="10" fill="#202c33"/>
    <circle cx="50" cy="197" r="9" fill="#25D366"/><path d="M45.5,197 l3.2,3.6 l6,-7.2" stroke="#06281a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="66" y="202" font-size="15" font-weight="700" fill="#e9edef">Bypassed — 2 servers, links live 7h</text>
    <text x="40" y="228" font-size="14" fill="#a5f3c0">•  bot.example/d/abc123</text>
    <text x="40" y="250" font-size="14" fill="#a5f3c0">•  bot.example/d/def456</text>
    <rect x="40" y="264" width="440" height="8" rx="4" fill="#0b141a"/>
    <rect x="40" y="264" width="0" height="8" rx="4" fill="#25D366">
      <animate attributeName="width" values="0;0;440;440;0" keyTimes="0;0.32;0.46;0.93;1" dur="14s" repeatCount="indefinite"/>
    </rect>
    <text x="40" y="290" font-size="11.5" fill="#8696a0">3 free bypasses left today · premium unlimited</text>
  </g>

  <!-- user bubble 2 : channel link -->
  <g opacity="1">
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.93;1" dur="14s" repeatCount="indefinite"/>
    <rect x="300" y="306" width="460" height="44" rx="10" fill="#005c4b"/>
    <text x="316" y="333" font-size="15" fill="#e9edef">whatsapp.com/channel/0029Vb…/2289</text>
    <text x="744" y="340" font-size="11" fill="#9fc5b8" text-anchor="end">15:33</text>
  </g>

  <!-- bot reply 2 : channel post bypassed -->
  <g opacity="1">
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.93;1" dur="14s" repeatCount="indefinite"/>
    <rect x="20" y="362" width="560" height="64" rx="10" fill="#202c33"/>
    <circle cx="50" cy="383" r="9" fill="#25D366"/><path d="M45.5,383 l3.2,3.6 l6,-7.2" stroke="#06281a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="66" y="388" font-size="15" font-weight="700" fill="#e9edef">5 links bypassed from that channel post</text>
    <text x="40" y="410" font-size="12" fill="#8696a0">OTHER MOMMY (2026) · 2160p / 1080p / 720p · Hindi + English</text>
  </g>
</svg>
